<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3c4d3">
  <title>Aniversário Júlia Yumi</title>
  <meta name="description" content="Convite para o aniversário de 18 anos de Júlia Yumi — 17 de outubro de 2026, às 19:30, na Vila Namata.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Aniversário Júlia Yumi">
  <meta property="og:description" content="Você está convidado para os 18 anos de Júlia Yumi! 17 de outubro de 2026, às 19:30, na Vila Namata. Toque para abrir o convite.">
  <meta property="og:locale" content="pt_BR">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">

  <style>
    :root {
      --rosa: #f3c4d3;
      --rosa-escuro: #eeb3c6;
      --rosa-claro: #fbe4ec;
      --rosa-texto: #8c4a60;
      --marfim: #fffaf6;
      --ouro: #e8a3bb;
      --ouro-claro: #ffffff;
      --tinta: #5b3a45;
      --tinta-suave: #a8677c;
      --preto: #e2839f;

      --script: "Pinyon Script", "Brush Script MT", cursive;
      --serif: "Cormorant Garamond", Garamond, "Times New Roman", serif;
      --sans: Jost, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      overflow-x: hidden;
    }

    body {
      font-family: var(--serif);
      color: var(--tinta);
      background: var(--rosa-claro);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; color: inherit; }

    :focus-visible {
      outline: 3px solid var(--ouro);
      outline-offset: 4px;
      border-radius: 4px;
    }

    .rotulo {
      font-family: var(--sans);
      font-weight: 500;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    /* ============ TELA 1: CAPA ============ */
    .capa {
      min-height: 100vh;
      min-height: 100dvh;
      padding: 32px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,0.78) 0%, rgba(255,255,255,0.35) 32%, rgba(255,255,255,0) 62%),
        var(--rosa);
      transition: opacity 0.35s ease;
    }
    .capa.is-fading { opacity: 0; }

    .capa-conteudo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: 100%;
    }

    .capa .rotulo { color: var(--rosa-texto); text-align: center; margin: 0; }

    .envelope {
      position: relative;
      width: min(330px, 100%);
      aspect-ratio: 1.42;
      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      perspective: 1000px;
      -webkit-perspective: 1000px;
      display: block;
    }
    .envelope:focus-visible { outline-offset: 10px; }

    .env-fundo,
    .env-bolso,
    .env-aba {
      position: absolute;
      inset: 0;
      border-radius: 6px;
    }

    .env-fundo {
      z-index: 1;
      background: var(--rosa-escuro);
      border: 1px solid var(--ouro);
      box-shadow: 0 24px 40px -18px rgba(120, 50, 70, 0.5);
    }

    .env-cartao {
      position: absolute;
      z-index: 2;
      left: 7%;
      top: 7%;
      width: 86%;
      height: 86%;
      background: var(--marfim);
      border: 1px solid rgba(232, 163, 187, 0.4);
      border-radius: 4px;
      display: grid;
      place-items: center;
      font-family: var(--script);
      font-size: 3.2rem;
      color: var(--rosa-texto);
      box-shadow: 0 4px 12px rgba(120, 50, 70, 0.15);
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .env-bolso {
      z-index: 3;
      background: linear-gradient(180deg, #f5cfdb 0%, var(--rosa) 100%);
      clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
      -webkit-clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
    }
    .env-bolso::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid var(--ouro);
      border-radius: 6px;
      opacity: 0.9;
      pointer-events: none;
    }

    .env-aba {
      z-index: 4;
      height: 57%;
      background: linear-gradient(180deg, var(--rosa-escuro) 0%, #f0bccd 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      -webkit-clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: 50% 0;
      transform: rotateX(0deg);
      transition: transform 0.75s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 6px 6px 0 0;
    }
    .env-aba::before {
      content: "";
      position: absolute;
      inset: 1px;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      -webkit-clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-top: 1px solid var(--ouro);
      opacity: 0.8;
    }

    .env-lacre {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 57%;
      width: 58px;
      height: 58px;
      transform: translate(-50%, -50%) scale(1);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff5f8, #f0b3c8 55%, #d9789a);
      box-shadow: 0 4px 10px rgba(140, 60, 90, 0.3), inset 0 0 0 2px rgba(255, 255, 255, 0.6);
      display: grid;
      place-items: center;
      font-family: var(--script);
      font-size: 1.55rem;
      color: #ffffff;
      transition: transform 0.45s ease, opacity 0.45s ease;
    }

    /* estados da animação */
    .envelope.lacre-some .env-lacre {
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
    }
    .envelope.aba-aberta .env-aba { transform: rotateX(180deg); }
    .envelope.aba-atras .env-aba { z-index: 0; }
    .envelope.cartao-sobe .env-cartao { transform: translateY(-46%); }

    .toque {
      color: var(--rosa-texto);
      animation: pulsar 2s ease-in-out infinite;
    }
    @keyframes pulsar {
      0%, 100% { opacity: 0.55; transform: translateY(0); }
      50%      { opacity: 1;    transform: translateY(-2px); }
    }

    /* ============ TELA 2: CONVITE ============ */
    .convite {
      min-height: 100vh;
      min-height: 100dvh;
      padding: 32px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background:
        radial-gradient(circle at 50% 30%, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.35) 35%, rgba(255,255,255,0) 65%),
        var(--rosa-claro);
    }

    .cartao {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: var(--marfim);
      border: 1px solid #fff;
      border-radius: 10px;
      box-shadow:
        0 30px 60px -20px rgba(120, 50, 70, 0.5),
        0 12px 28px rgba(120, 50, 70, 0.18);
      padding: 24px;
    }
    .cartao::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(232, 163, 187, 0.55);
      border-radius: 6px;
      pointer-events: none;
    }

    .cartao-conteudo {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
    }
    :where(.cartao-conteudo p, .cartao-conteudo h1) { margin: 0; }

    .foto {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border-radius: 6px;
      background: var(--rosa-claro);
    }
    .foto svg {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .foto::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 34%;
      background: linear-gradient(to bottom, rgba(255,250,246,0) 0%, var(--marfim) 100%);
      pointer-events: none;
    }

    .convidam {
      margin-top: 4px;
      color: var(--tinta-suave);
    }
    .idade { color: var(--rosa-texto); }
    .titulo {
      margin: 2px 0 12px;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(2rem, 9vw, 2.6rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1;
      color: var(--tinta);
    }

    .data {
      width: 100%;
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 14px 4px;
      border-top: 1px solid var(--ouro);
      border-bottom: 1px solid var(--ouro);
    }
    .data .col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .data .rotulo { color: var(--tinta-suave); font-size: 0.66rem; }
    .data .valor {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1;
    }
    .data .num {
      display: block;
      font-size: 2.3rem;
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1;
      margin-bottom: 4px;
      color: var(--rosa-texto);
    }
    .data .hora {
      font-size: 2.3rem;
      letter-spacing: 0.02em;
      color: var(--rosa-texto);
    }
    .data .hora small {
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      vertical-align: 0.9em;
      margin-left: 2px;
    }
    .coracao {
      width: 16px;
      height: 16px;
      margin: 0 14px;
      color: var(--ouro);
    }

    .extenso {
      margin-top: 12px;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--tinta-suave);
    }
    .local {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .local .rotulo { color: var(--tinta-suave); font-size: 0.66rem; }
    .local .nome {
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .botao {
      width: 100%;
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 18px;
      border-radius: 6px;
      border: 1px solid var(--preto);
      background: var(--preto);
      color: var(--ouro-claro);
      text-decoration: none;
      font-family: var(--sans);
      font-weight: 500;
      font-size: 0.78rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .botao:hover { background: #d9789a; border-color: #d9789a; }
    .botao:active { transform: scale(0.985); }
    .botao svg { width: 18px; height: 18px; flex: 0 0 auto; }

    .assinatura {
      margin: 6px 0 0;
      font-style: italic;
      font-size: 1.1rem;
      color: #fff;
      text-shadow: 0 1px 6px rgba(120, 50, 70, 0.35);
      text-align: center;
    }

    .voltar {
      background: none;
      border: 0;
      padding: 8px 12px;
      cursor: pointer;
      color: var(--rosa-texto);
      font-family: var(--sans);
      font-size: 0.66rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      opacity: 0.85;
    }
    .voltar:hover { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }

    @media (prefers-reduced-motion: reduce) {
      .toque { animation: none; opacity: 0.85; }
      .env-lacre, .env-aba, .env-cartao, .capa { transition: none; }
    }
  </style>
</head>

  <script>
    (function () {
      var capa = document.getElementById('capa');
      var convite = document.getElementById('convite');
      var envelope = document.getElementById('envelope');
      var voltar = document.getElementById('voltar');
      var abrindo = false;

      var reduzMovimento = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function mostrarConvite() {
        capa.hidden = true;
        convite.hidden = false;
        window.scrollTo(0, 0);
        abrindo = false;
      }

      function abrir() {
        if (abrindo) return;
        abrindo = true;

        if (reduzMovimento) {
          mostrarConvite();
          return;
        }

        // 1. o lacre encolhe e some (0.45s)
        envelope.classList.add('lacre-some');

        // 2. a aba gira para cima (0.75s) e cai para trás do envelope
        setTimeout(function () { envelope.classList.add('aba-aberta'); }, 450);
        setTimeout(function () { envelope.classList.add('aba-atras'); }, 850);

        // 3. o cartão sobe para fora do envelope
        setTimeout(function () { envelope.classList.add('cartao-sobe'); }, 1150);

        // 4. a capa some e o convite aparece
        setTimeout(function () { capa.classList.add('is-fading'); }, 1450);
        setTimeout(mostrarConvite, 1800);
      }

      function fechar() {
        convite.hidden = true;
        envelope.classList.remove('lacre-some', 'aba-aberta', 'aba-atras', 'cartao-sobe');
        capa.classList.remove('is-fading');
        capa.hidden = false;
        window.scrollTo(0, 0);
        envelope.focus({ preventScroll: true });
      }

      envelope.addEventListener('click', abrir);
      voltar.addEventListener('click', fechar);
    })();
  </script>
